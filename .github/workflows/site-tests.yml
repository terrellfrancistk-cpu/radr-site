# radr.tkhub.app checks (added 2026-11-13): pages load, WCAG A/AA in both
# palettes, Dark default, working internal links, tap areas, required policy
# sections, no builder or AI vendor names. Serves the folder locally; never
# touches the live domain and deploys nothing.
name: site-tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/site-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the checks
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-test-results
          path: .github/site-tests/test-results/
          retention-days: 7
