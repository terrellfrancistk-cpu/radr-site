<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Signing in to RADR</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:site_name" content="RADR">
<meta property="og:image" content="https://radr.tkhub.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The RADR logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://radr.tkhub.app/og-image.jpg">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0A0D0A;color:#E8F0EA;display:flex;min-height:100vh;align-items:center;justify-content:center}main{max-width:420px;padding:24px;text-align:center}a.b{display:block;margin:12px 0;padding:14px;border-radius:12px;background:#3DDC84;color:#0A0D0A;font-weight:700;text-decoration:none}a{color:#3DDC84}code{font-size:1.4em;letter-spacing:.1em}</style></head><body><main>
<img src="/icon-192.png" srcset="/icon-192.png 192w, /icon-512.png 512w" sizes="72px" width="72" height="72" alt="RADR logo" style="display:block;margin:0 auto 14px;border-radius:16px"><h1>RADR</h1><p id="m">Finishing sign-in…</p><a class="b" id="o" href="#" style="display:none">Open RADR</a></main>
<script>
var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));
var err=q.get("error_description")||q.get("error")||h.get("error_description")||h.get("error");
var code=q.get("code");
if(err){document.getElementById("m").textContent="Sign-in didn't finish: "+err+". Go back to RADR and try again.";}
else if(code&&/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
 var u="rork-fep0gxqfi1xjmq14cu1jh://auth?app=radr&code="+encodeURIComponent(code);
 var o=document.getElementById("o");o.href=u;o.style.display="block";
 document.getElementById("m").textContent="Returning you to RADR…";location.replace(u);}
else{location.replace("https://radr-drive.rork.app/auth/callback"+location.search+location.hash);}
</script></body></html>
